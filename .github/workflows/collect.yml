name: Collect community data

# Daily incremental collection plus manual runs.
# The GITHUB_TOKEN is injected by Actions and never exposed to the frontend.

on:
  schedule:
    # 02:10 UTC every day.
    - cron: '10 2 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: 'Run a full re-collection (ignores incremental hints)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Monitored project(s) — comma-separated list (override with a repository variable if needed).
          MONITOR_REPOS: ${{ vars.MONITOR_REPOS || 'openJiuwen-ai/sciencediscovery,ThinkFlowLab/system1-agents,ThinkFlowLab/vllm-rlt,ThinkFlowLab/system1-omni,ThinkFlowLab/nanodot,ThinkFlowLab/vllm-omni-mlx,ThinkFlowLab/OmniRSI,ThinkFlowLab/nanoMuse,ThinkFlowLab/mobilegym,ThinkFlowLab/OpenMinis,ThinkFlowLab/orbit_tests,ThinkFlowLab/pi,ThinkFlowLab/mlx-perf,ThinkFlowLab/agentic-video-generation,ThinkFlowLab/agent-core' }}
          MONITOR_MAX_LIST_PAGES: '40'
          MONITOR_BOTS: ${{ vars.MONITOR_BOTS }}
        run: npm run collect

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          if git diff --quiet --cached; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh community metrics [skip ci]"
            git push
          fi

      - name: Upload collection artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-data
          path: public/data
          retention-days: 14